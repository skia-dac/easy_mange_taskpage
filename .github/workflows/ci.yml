name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Vérifications (types, lint, format, tests, sécurité)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Node exécute Jest, Expo et ESLint ; Bun installe les dépendances et lance les scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Types TypeScript (compilateur TypeScript 7)
        run: bun run typecheck
      - name: Lint (règles MySky, 0 avertissement)
        run: bun run lint
      - name: Formatage
        run: bun run format:check
      - name: Tests
        run: bun run test --ci
      - name: Server schema on Postgres
        run: bun run test:server
      - name: Audit sécurité des dépendances (niveau élevé et critique)
        run: bun run audit:prod
      - name: Diagnostic Expo
        run: bunx expo-doctor
      - name: Bundle iOS et Android (ce qu'Expo Go charge)
        run: bun run check:bundle
